name: Build Verona APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet jdatetime

      - name: Build APK (Non-Interactive)
        env:
          CI: "true"
        run: |
          # ارسال خودکار پاسخ مثبت در صورت نیاز به دانلود ابزارها
          yes | flet build apk --project . -v || flet build apk -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Verona-App-APK
          path: |
            build/apk/*.apk
            dist/*.apk
            build/*.apk
            **/*.apk
          if-no-files-found: warn
